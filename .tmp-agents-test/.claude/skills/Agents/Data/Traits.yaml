    keywords: ["security", "vulnerability"]
  research:
    name: "Researcher"
    description: "Researches stuff"
personality:
  skeptical:
    name: "Skeptical"
    description: "Questions assumptions"
  analytical:
    name: "Analytical"
    description: "Analyzes stuff"
