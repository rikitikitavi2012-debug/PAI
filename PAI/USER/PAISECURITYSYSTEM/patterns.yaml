# PAI Security Patterns v1.0
# Used by SecurityValidator.hook.ts (PreToolUse)
# Format: YAML with pattern objects for bash, path strings for paths

version: "1.0"

philosophy:
  mode: "defensive"
  principle: "Block catastrophic, confirm destructive, alert suspicious, allow everything else"

# ════════════════════════════════════════
# Bash Command Patterns
# ════════════════════════════════════════

bash:
  # ── Trusted: Fast-path allow, no logging ──
  trusted:
    - pattern: "^ls\\b"
      reason: "Directory listing"
    - pattern: "^cat\\b"
      reason: "File display"
    - pattern: "^echo\\b"
      reason: "Echo command"
    - pattern: "^pwd$"
      reason: "Print working directory"
    - pattern: "^git\\s+(status|log|diff|branch|show|remote|stash\\s+list)"
      reason: "Safe git read operations"
    - pattern: "^bun\\s+(test|run|build)"
      reason: "Bun commands"
    - pattern: "^npm\\s+(test|run|list)"
      reason: "NPM commands"
    - pattern: "^head\\b"
      reason: "File head"
    - pattern: "^tail\\b"
      reason: "File tail"
    - pattern: "^wc\\b"
      reason: "Word count"
    - pattern: "^grep\\b"
      reason: "Search"
    - pattern: "^rg\\b"
      reason: "Ripgrep search"
    - pattern: "^find\\b"
      reason: "Find files"
    - pattern: "^which\\b"
      reason: "Locate command"
    - pattern: "^date$"
      reason: "Show date"
    - pattern: "^whoami$"
      reason: "Show user"

  # ── Blocked: Hard block, exit 2 ──
  blocked:
    - pattern: "rm\\s+(-[a-zA-Z]*f[a-zA-Z]*\\s+)?(-[a-zA-Z]*r[a-zA-Z]*\\s+)?/\\s*$"
      reason: "Filesystem destruction: rm on root"
    - pattern: "rm\\s+-[a-zA-Z]*r[a-zA-Z]*\\s+-[a-zA-Z]*f[a-zA-Z]*\\s+/"
      reason: "Filesystem destruction: rm -rf /"
    - pattern: "rm\\s+-rf\\s+/"
      reason: "Filesystem destruction: rm -rf /"
    - pattern: "rm\\s+-rf\\s+~"
      reason: "Home directory destruction"
    - pattern: "rm\\s+-rf\\s+\\$HOME"
      reason: "Home directory destruction"
    - pattern: "rm\\s+-rf\\s+~/\\.claude"
      reason: "PAI infrastructure destruction"
    - pattern: "mkfs\\."
      reason: "Filesystem formatting"
    - pattern: "dd\\s+if=/dev/(zero|random|urandom)"
      reason: "Disk overwrite"
    - pattern: "diskutil\\s+erase"
      reason: "Disk erasure"
    - pattern: ":(){ :\\|:& };:"
      reason: "Fork bomb"
    - pattern: "gh\\s+repo\\s+delete"
      reason: "Repository deletion"
    - pattern: "curl.*\\|\\s*(ba)?sh"
      reason: "Pipe to shell execution"
    - pattern: "wget.*\\|\\s*(ba)?sh"
      reason: "Pipe to shell execution"
    - pattern: ">\\s*/dev/sda"
      reason: "Direct disk write"
    - pattern: "chmod\\s+-R\\s+777\\s+/"
      reason: "Recursive root permission change"

  # ── Confirm: Prompt user before executing ──
  confirm:
    - pattern: "git\\s+push\\s+--force"
      reason: "Force push can lose remote commits"
    - pattern: "git\\s+push\\s+-f\\b"
      reason: "Force push can lose remote commits"
    - pattern: "git\\s+reset\\s+--hard"
      reason: "Hard reset loses uncommitted changes"
    - pattern: "git\\s+clean\\s+-[a-zA-Z]*f"
      reason: "Git clean removes untracked files"
    - pattern: "git\\s+checkout\\s+--\\s+\\."
      reason: "Discard all changes"
    - pattern: "git\\s+branch\\s+-D"
      reason: "Force delete branch"
    - pattern: "DROP\\s+(DATABASE|TABLE)"
      reason: "Database destruction"
    - pattern: "TRUNCATE\\s+TABLE"
      reason: "Table data deletion"
    - pattern: "terraform\\s+destroy"
      reason: "Infrastructure destruction"
    - pattern: "docker\\s+system\\s+prune"
      reason: "Docker resource cleanup"
    - pattern: "npm\\s+publish"
      reason: "Package publication"
    - pattern: "rm\\s+-rf\\s"
      reason: "Recursive force delete"

  # ── Alert: Log but allow ──
  alert:
    - pattern: "^sudo\\b"
      reason: "Elevated privilege execution"
    - pattern: "chmod\\s+[0-7]*7"
      reason: "World-writable permissions"
    - pattern: "ssh\\b"
      reason: "Remote shell access"
    - pattern: "scp\\b"
      reason: "Remote file copy"
    - pattern: "rsync\\b"
      reason: "Remote sync"
    - pattern: "nc\\b"
      reason: "Netcat connection"
    - pattern: "nmap\\b"
      reason: "Network scan"

# ════════════════════════════════════════
# File Path Patterns
# ════════════════════════════════════════

paths:
  # ── Zero Access: Complete denial ──
  zeroAccess:
    - "~/.ssh/id_*"
    - "~/.ssh/config"
    - "~/.ssh/known_hosts"
    - "~/.aws/credentials"
    - "~/.aws/config"
    - "~/.gnupg/**"
    - "~/.config/gh/hosts.yml"
    - "**/.env.local"
    - "**/credentials.json"
    - "**/service-account*.json"
    - "~/.netrc"
    - "~/.config/PAI/.env"

  # ── Read Only: Can read, cannot write/delete ──
  readOnly:
    - "/etc/**"
    - "/usr/**"

  # ── Confirm Write: Can read, writing requires confirmation ──
  confirmWrite:
    - "~/.claude/settings.json"
    - "**/.env"
    - "**/.env.production"
    - "**/package.json"
    - "**/tsconfig.json"
    - "~/.bashrc"
    - "~/.zshrc"
    - "~/.profile"

  # ── No Delete: Can read/write, cannot delete ──
  noDelete:
    - "~/.claude/hooks/**"
    - "~/.claude/CLAUDE.md"
    - "~/.claude/PAI/**"
    - ".git/**"

# ════════════════════════════════════════
# Project-Specific Rules
# ════════════════════════════════════════

projects:
  pai:
    path: "~/.claude"
    rules:
      - action: "noDelete"
        reason: "PAI infrastructure files"
